# Render Blueprint Specification for Weather ETL Pipeline
services:
  - type: web
    name: weather-etl-pipeline
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false # Set manually in Render Dashboard with your MySQL connection string
      - key: API_SECRET_KEY
        generateValue: true # Render will automatically generate a secure random secret key
